include:
  - ../traefik/networks.compose.yaml

services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: https://beszel.${TAILNET_DOMAIN:?TAILNET_DOMAIN variable not set}
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      start_period: 10s
      timeout: 5s
    networks:
      - traefik-beszel
    labels:
      traefik.enable: true
      traefik.http.routers.beszel.rule: Host(`beszel.${TAILNET_DOMAIN:?TAILNET_DOMAIN variable not set}`)
      traefik.http.services.beszel.loadbalancer.server.port: 8090
      traefik.http.routers.beszel.entrypoints: websecure

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      # HUB_URL: https://beszel.${TAILNET_DOMAIN:?TAILNET_DOMAIN variable not set}
      TOKEN: ${BESZEL_TOKEN:?BESZEL_TOKEN variable not set}
      KEY: ${BESZEL_KEY:?BESZEL_KEY variable not set}
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 120s

volumes:
  beszel_data:
    name: beszel_data
    driver: local
  beszel_socket:
    name: beszel_socket
    driver: local
  beszel_agent_data:
    name: beszel_agent_data
    driver: local
